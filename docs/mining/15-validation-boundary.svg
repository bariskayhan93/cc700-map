<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">What local work can prove — and what needs the device</title><desc id="desc">Coverage is a set of evidence boundaries, not a percentage of decoded instructions.</desc>
<rect x="0" y="0" width="1000" height="920" rx="0" fill="#ffffff" stroke="none"/>
<text x="38" y="46" font-family="Arial" font-size="27" font-weight="bold" fill="#182e43" text-anchor="start">What local work can prove — and what needs the device</text>
<text x="38" y="77" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Coverage is a set of evidence boundaries, not a percentage of decoded instructions.</text>
