<polygon points="500,252 495.6503446588877,242.99552897647322 504.3496553411123,242.99552897647322" fill="#50677b"/>
<line x1="742" y1="189" x2="742" y2="225" stroke="#50677b" stroke-width="2"/>
<line x1="742" y1="225" x2="500" y2="225" stroke="#50677b" stroke-width="2"/>
<polygon points="500,225 509.0044710235268,220.6503446588877 509.0044710235268,229.3496553411123" fill="#50677b"/>
<rect x="290" y="252" width="420" height="74" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="500.0" y="286.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Replay-aware GPS getter</text>
<text x="500.0" y="312.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x420eeaa8 selects by active byte</text>
<line x1="500" y1="326" x2="500" y2="360" stroke="#50677b" stroke-width="2"/>
<polygon points="500,360 495.6503446588877,350.9955289764732 504.3496553411123,350.9955289764732" fill="#50677b"/>
<rect x="290" y="360" width="420" height="74" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="500.0" y="394.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Heading source selector</text>
<text x="500.0" y="420.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x4204dfe0; persistent cached heading</text>
<line x1="290" y1="397" x2="246" y2="397" stroke="#50677b" stroke-width="2"/>
<line x1="246" y1="397" x2="246" y2="489" stroke="#50677b" stroke-width="2"/>
<polygon points="246,489 241.6503446588877,479.9955289764732 250.3496553411123,479.9955289764732" fill="#50677b"/>
<line x1="710" y1="397" x2="754" y2="397" stroke="#50677b" stroke-width="2"/>
<line x1="754" y1="397" x2="754" y2="489" stroke="#50677b" stroke-width="2"/>
<polygon points="754,489 749.6503446588877,479.9955289764732 758.3496553411123,479.9955289764732" fill="#50677b"/>
<rect x="38" y="489" width="415" height="99" rx="9" fill="#e6f3ed" stroke="#26715c"/>
<text x="245.5" y="535.5" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Speed ≥ 3000</text>
<text x="245.5" y="561.5" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Nonzero GPS course / 1000; else retain</text>
<rect x="497" y="489" width="465" height="99" rx="9" fill="#fff4dd" stroke="#976112"/>
<text x="729.5" y="535.5" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Speed comparison fails</text>
<text x="729.5" y="561.5" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Fix byte = 1 AND magnetic status = 3?</text>
<text x="520" y="619" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Yes: magnetic heading. Otherwise: retain cache.</text>
