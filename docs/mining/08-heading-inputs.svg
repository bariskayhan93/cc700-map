<line x1="246" y1="651" x2="500" y2="651" stroke="#50677b" stroke-width="2"/>
<line x1="500" y1="651" x2="500" y2="679" stroke="#50677b" stroke-width="2"/>
<polygon points="500,679 495.6503446588877,669.9955289764732 504.3496553411123,669.9955289764732" fill="#50677b"/>
<line x1="754" y1="588" x2="980" y2="588" stroke="#50677b" stroke-width="2"/>
<line x1="980" y1="588" x2="980" y2="651" stroke="#50677b" stroke-width="2"/>
<line x1="980" y1="651" x2="500" y2="651" stroke="#50677b" stroke-width="2"/>
<polygon points="500,651 509.0044710235268,646.6503446588877 509.0044710235268,655.3496553411123" fill="#50677b"/>
<rect x="290" y="679" width="420" height="74" rx="9" fill="#e6f3ed" stroke="#26715c"/>
<text x="500.0" y="713.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">450 − cached heading → setter</text>
<text x="500.0" y="739.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x4204a504, mode 1: immediate update</text>
<text x="38" y="796" font-family="Arial" font-size="20" font-weight="normal" fill="#182e43" text-anchor="start">FIT replay derives course from position history; it does not replace magnetic state.</text>
</svg>
