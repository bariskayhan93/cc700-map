<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="825" viewBox="0 0 1000 825" role="img" aria-labelledby="title desc">
<title id="title">Navigation has two GPS sources and a magnetic fallback</title><desc id="desc">Extracted firmware paths; physical sensor activity and replay activation remain untested.</desc>
<rect x="0" y="0" width="1000" height="825" rx="0" fill="#ffffff" stroke="none"/>
<text x="38" y="46" font-family="Arial" font-size="27" font-weight="bold" fill="#182e43" text-anchor="start">Navigation has two GPS sources and a magnetic fallback</text>
<text x="38" y="77" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Extracted firmware paths; physical sensor activity and replay activation remain untested.</text>
<rect x="38" y="115" width="440" height="74" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="258.0" y="149.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Live GNSS / RMC producer</text>
<text x="258.0" y="175.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x420edec4 → record 0x3c3ae39c</text>
<rect x="522" y="115" width="440" height="74" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="742.0" y="149.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Native FIT replay task</text>
<text x="742.0" y="175.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x420b59dc → allocated 52-byte record</text>
<line x1="258" y1="189" x2="258" y2="225" stroke="#50677b" stroke-width="2"/>
<line x1="258" y1="225" x2="500" y2="225" stroke="#50677b" stroke-width="2"/>
