<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">Off-route is a decision followed by persistent state</title><desc id="desc">Extracted local branches; invocation count is not yet a wall-clock timing contract.</desc>
<rect x="0" y="0" width="1000" height="840" rx="0" fill="#ffffff" stroke="none"/>
<text x="38" y="46" font-family="Arial" font-size="27" font-weight="bold" fill="#182e43" text-anchor="start">Off-route is a decision followed by persistent state</text>
<text x="38" y="77" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Extracted local branches; invocation count is not yet a wall-clock timing contract.</text>
<rect x="38" y="112" width="440" height="86" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="258.0" y="152.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Route matching and geometry</text>
<text x="258.0" y="178.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">0x4204b1e0; main table = 72 × all points</text>
<rect x="522" y="112" width="440" height="86" rx="9" fill="#fcecef" stroke="#ae3546"/>
<text x="742.0" y="152.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Invalid input / zero point count</text>
<text x="742.0" y="178.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Immediate committed off-route = 1</text>
<line x1="258" y1="198" x2="258" y2="232" stroke="#50677b" stroke-width="2"/>
<polygon points="258,232 253.6503446588877,222.99552897647322 262.3496553411123,222.99552897647322" fill="#50677b"/>
<rect x="38" y="232" width="440" height="86" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="258.0" y="272.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Distance + angle + speed decision</text>
<text x="258.0" y="298.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Candidate 0 or 1; 0x4204bdb8 onward</text>
<line x1="258" y1="318" x2="258" y2="351" stroke="#50677b" stroke-width="2"/>
<line x1="258" y1="351" x2="500" y2="351" stroke="#50677b" stroke-width="2"/>
<line x1="500" y1="351" x2="500" y2="374" stroke="#50677b" stroke-width="2"/>
<polygon points="500,374 495.6503446588877,364.9955289764732 504.3496553411123,364.9955289764732" fill="#50677b"/>
<polygon points="500.0,374 715,430.0 500.0,486 285,430.0" fill="#fff4dd" stroke="#976112" stroke-width="2"/>
<text x="500.0" y="429.0" font-family="Arial" font-size="20" font-weight="bold" fill="#182e43" text-anchor="middle">Candidate changed?</text>
<text x="500.0" y="453.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Compared with prior candidate byte +147</text>
<line x1="285" y1="430" x2="248" y2="430" stroke="#50677b" stroke-width="2"/>
<line x1="248" y1="430" x2="248" y2="530" stroke="#50677b" stroke-width="2"/>
<polygon points="248,530 243.6503446588877,520.9955289764732 252.3496553411123,520.9955289764732" fill="#50677b"/>
<text x="240" y="462" font-family="Arial" font-size="18" font-weight="normal" fill="#182e43" text-anchor="start">Yes</text>
<line x1="715" y1="430" x2="752" y2="430" stroke="#50677b" stroke-width="2"/>
<line x1="752" y1="430" x2="752" y2="530" stroke="#50677b" stroke-width="2"/>
<polygon points="752,530 747.6503446588877,520.9955289764732 756.3496553411123,520.9955289764732" fill="#50677b"/>
<text x="765" y="462" font-family="Arial" font-size="18" font-weight="normal" fill="#182e43" text-anchor="start">No</text>
<rect x="38" y="530" width="420" height="86" rx="9" fill="#fff4dd" stroke="#976112"/>
<text x="248.0" y="570.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Reset repeat counter to 0</text>
<text x="248.0" y="596.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Keep committed state; remember candidate</text>
<rect x="502" y="530" width="460" height="86" rx="9" fill="#e6f3ed" stroke="#26715c"/>
<text x="732.0" y="570.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Increment repeat counter</text>
<text x="732.0" y="596.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">At 10: commit candidate and clamp to 10</text>
<line x1="248" y1="616" x2="248" y2="651" stroke="#50677b" stroke-width="2"/>
<line x1="248" y1="651" x2="500" y2="651" stroke="#50677b" stroke-width="2"/>
<line x1="500" y1="651" x2="500" y2="678" stroke="#50677b" stroke-width="2"/>
<polygon points="500,678 495.6503446588877,668.9955289764732 504.3496553411123,668.9955289764732" fill="#50677b"/>
<line x1="752" y1="616" x2="752" y2="651" stroke="#50677b" stroke-width="2"/>
<line x1="752" y1="651" x2="500" y2="651" stroke="#50677b" stroke-width="2"/>
<polygon points="500,651 509.0044710235268,646.6503446588877 509.0044710235268,655.3496553411123" fill="#50677b"/>
<rect x="285" y="678" width="430" height="76" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="500.0" y="713.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Publish 148-byte result</text>
<text x="500.0" y="739.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Committed byte +145 → basemap draw gate</text>
<line x1="742" y1="198" x2="980" y2="198" stroke="#ae3546" stroke-width="2"/>
<line x1="980" y1="198" x2="980" y2="716" stroke="#ae3546" stroke-width="2"/>
<line x1="980" y1="716" x2="715" y2="716" stroke="#ae3546" stroke-width="2"/>
<polygon points="715,716 724.0044710235268,711.6503446588877 724.0044710235268,720.3496553411123" fill="#ae3546"/>
<text x="38" y="795" font-family="Arial" font-size="19" font-weight="normal" fill="#50677b" text-anchor="start">Mode 1 additionally resets the counter while committed off-route is 1.</text>
<text x="38" y="823" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Normal dispatcher call uses mode 0. Proximity flag +144 has separate reload effects.</text>
</svg>
