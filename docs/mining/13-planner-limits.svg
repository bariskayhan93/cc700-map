<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc">
<title id="title">Planner limits govern different decisions</title><desc id="desc">Extracted enforcement in V1.414 / saved v16; runtime costs remain unmeasured.</desc>
<rect x="0" y="0" width="1000" height="910" rx="0" fill="#ffffff" stroke="none"/>
<text x="38" y="46" font-family="Arial" font-size="27" font-weight="bold" fill="#182e43" text-anchor="start">Planner limits govern different decisions</text>
<text x="38" y="77" font-family="Arial" font-size="18" font-weight="normal" fill="#50677b" text-anchor="start">Extracted enforcement in V1.414 / saved v16; runtime costs remain unmeasured.</text>
<text x="38" y="129" font-family="Arial" font-size="19" font-weight="bold" fill="#246b9b" text-anchor="start">DATA LOADING</text>
<rect x="38" y="151" width="435" height="88" rx="9" fill="#fff4dd" stroke="#976112"/>
<text x="255.5" y="192.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Current free heap &lt; 2 MiB?</text>
<text x="255.5" y="218.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Context +48; 0x420df532</text>
<line x1="473" y1="195" x2="528" y2="195" stroke="#50677b" stroke-width="2"/>
<polygon points="528,195 518.9955289764732,199.3496553411123 518.9955289764732,190.6503446588877" fill="#50677b"/>
<text x="500" y="181" font-family="Arial" font-size="17" font-weight="normal" fill="#976112" text-anchor="middle">Yes</text>
<rect x="528" y="151" width="434" height="88" rx="9" fill="#fff4dd" stroke="#976112"/>
<text x="745.0" y="192.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Release graph caches</text>
<text x="745.0" y="218.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Continue loading; no reservation</text>
<text x="38" y="289" font-family="Arial" font-size="19" font-weight="bold" fill="#246b9b" text-anchor="start">SEARCH LOOP · ordered checks</text>
<rect x="38" y="315" width="435" height="78" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="255.5" y="351.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Current free heap &lt; 1 MiB?</text>
<text x="255.5" y="377.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Context +52; 0x420e2410</text>
<line x1="473" y1="354" x2="528" y2="354" stroke="#ae3546" stroke-width="2"/>
<polygon points="528,354 518.9955289764732,358.3496553411123 518.9955289764732,349.6503446588877" fill="#ae3546"/>
<text x="500" y="340" font-family="Arial" font-size="17" font-weight="normal" fill="#ae3546" text-anchor="middle">Yes</text>
<rect x="528" y="315" width="434" height="78" rx="9" fill="#fcecef" stroke="#ae3546"/>
<text x="745.0" y="351.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Abort: output code 1</text>
<text x="745.0" y="377.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Free-heap floor, not allocation cap</text>
<line x1="255" y1="393" x2="255" y2="437" stroke="#50677b" stroke-width="2"/>
<polygon points="255,437 250.6503446588877,427.9955289764732 259.3496553411123,427.9955289764732" fill="#50677b"/>
<text x="270" y="422" font-family="Arial" font-size="17" font-weight="normal" fill="#182e43" text-anchor="start">No</text>
<rect x="38" y="437" width="435" height="78" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="255.5" y="473.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Elapsed time &gt; 15 seconds?</text>
<text x="255.5" y="499.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Seconds-format clock; context +72</text>
<line x1="473" y1="476" x2="528" y2="476" stroke="#ae3546" stroke-width="2"/>
<polygon points="528,476 518.9955289764732,480.3496553411123 518.9955289764732,471.6503446588877" fill="#ae3546"/>
<text x="500" y="462" font-family="Arial" font-size="17" font-weight="normal" fill="#ae3546" text-anchor="middle">Yes</text>
<rect x="528" y="437" width="434" height="78" rx="9" fill="#fcecef" stroke="#ae3546"/>
<text x="745.0" y="473.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Abort: output code 2</text>
<text x="745.0" y="499.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Negative limit disables this check</text>
<line x1="255" y1="515" x2="255" y2="559" stroke="#50677b" stroke-width="2"/>
<polygon points="255,559 250.6503446588877,549.9955289764732 259.3496553411123,549.9955289764732" fill="#50677b"/>
<text x="270" y="544" font-family="Arial" font-size="17" font-weight="normal" fill="#182e43" text-anchor="start">No</text>
<rect x="38" y="559" width="435" height="78" rx="9" fill="#edf4fa" stroke="#246b9b"/>
<text x="255.5" y="595.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Cancellation requested?</text>
<text x="255.5" y="621.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Word at 0x3fca2bd8</text>
<line x1="473" y1="598" x2="528" y2="598" stroke="#ae3546" stroke-width="2"/>
<polygon points="528,598 518.9955289764732,602.3496553411123 518.9955289764732,593.6503446588877" fill="#ae3546"/>
<text x="500" y="584" font-family="Arial" font-size="17" font-weight="normal" fill="#ae3546" text-anchor="middle">Yes</text>
<rect x="528" y="559" width="434" height="78" rx="9" fill="#fcecef" stroke="#ae3546"/>
<text x="745.0" y="595.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Abort: output code 3</text>
<text x="745.0" y="621.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">No frontier instead gives code 4</text>
<line x1="255" y1="637" x2="255" y2="681" stroke="#50677b" stroke-width="2"/>
<polygon points="255,681 250.6503446588877,671.9955289764732 259.3496553411123,671.9955289764732" fill="#50677b"/>
<text x="270" y="666" font-family="Arial" font-size="17" font-weight="normal" fill="#182e43" text-anchor="start">No</text>
<rect x="38" y="681" width="435" height="78" rx="9" fill="#e6f3ed" stroke="#26715c"/>
<text x="255.5" y="717.0" font-family="Arial" font-size="21" font-weight="bold" fill="#182e43" text-anchor="middle">Continue frontier search</text>
<text x="255.5" y="743.0" font-family="Arial" font-size="17" font-weight="normal" fill="#50677b" text-anchor="middle">Yield call every 501 loop visits</text>
<text x="528" y="707" font-family="Arial" font-size="20" font-weight="bold" fill="#182e43" text-anchor="start">These are planner output codes.</text>
<text x="528" y="739" font-family="Arial" font-size="19" font-weight="normal" fill="#50677b" text-anchor="start">Outer navigation maps them separately.</text>
<text x="38" y="823" font-family="Arial" font-size="20" font-weight="bold" fill="#182e43" text-anchor="start">2 MiB triggers cleanup; 1 MiB stops search. Neither value is measured headroom.</text>
<text x="38" y="867" font-family="Arial" font-size="19" font-weight="normal" fill="#50677b" text-anchor="start">Peak heap, fragmentation, check latency and physical timing still require observation.</text>
</svg>
