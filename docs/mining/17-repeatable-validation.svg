<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">CC700 repeatable validation boundary</title>
<desc id="desc">Actual app and patch source run in local checks. Extracted behavior models are separate. Native replay telemetry, device budgets and physical acceptance remain unvalidated.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526273"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#f7f9fc"/>
<g font-family="Arial,sans-serif" fill="#172c42">
<text x="28" y="38" font-size="23" font-weight="bold">Repeat code changes locally; reserve rides for physical evidence</text>
<text x="28" y="64" font-size="14">2026-11-14 · Passing host tests do not imply full device simulation.</text>
<rect x="28" y="91" width="270" height="191" rx="10" fill="#e7f3eb" stroke="#73a987"/>
<text x="46" y="120" font-size="17" font-weight="bold">Actual production code</text>
<g font-size="15"><text x="46" y="151">App route builder and preview</text><text x="46" y="179">C map loader and arrow</text><text x="46" y="207">C styled renderer + sanitizers</text><text x="46" y="249" fill="#486354">Host adapters have explicit limits</text></g>
<rect x="28" y="306" width="270" height="119" rx="10" fill="#eaf0fb" stroke="#8098c0"/>
<text x="46" y="336" font-size="17" font-weight="bold">Extracted branch models</text>
<text x="46" y="365" font-size="15">Off-route, heading, timers, replay</text>
<text x="46" y="396" font-size="14" fill="#51647e">Manual transcription; no CPU emulation</text>
<rect x="347" y="157" width="240" height="193" rx="10" fill="#fff" stroke="#526273" stroke-width="2"/>
<text x="366" y="190" font-size="18" font-weight="bold">One offline command</text>
<text x="366" y="222" font-size="14" font-family="monospace">tools/validate_local.py</text>
<text x="366" y="255" font-size="15">Logs + hashes + explicit failures</text>
<text x="366" y="285" font-size="15">Recorded ride coverage proxy</text>
<text x="366" y="321" font-size="14" fill="#9b570d">Generator gaps stay visible</text>
<path d="M298 185H337M298 363L337 309" stroke="#526273" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M588 252H635" stroke="#526273" fill="none" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="649" y="91" width="283" height="334" rx="10" fill="#fff1df" stroke="#c29456"/>
<text x="667" y="120" font-size="17" font-weight="bold">Device evidence still required</text>
<g font-size="15"><text x="667" y="156">Native decode → consume → publish</text><text x="667" y="184">EOF / stop / return to live GPS</text><text x="667" y="222">Frame, lock and heap measurements</text><text x="667" y="260">Phone reroute and cleanup</text><text x="667" y="298">Board / peer sensor capability</text><text x="667" y="336">Targeted physical acceptance</text></g>
<text x="667" y="382" font-size="14" fill="#9b570d">Requires isolated replay activity:</text>
<text x="667" y="404" font-size="14" fill="#9b570d">resume can truncate recording files</text>
<text x="28" y="469" font-size="16" font-weight="bold">Current firmware: v18 installed, readback verified, boot observed.</text>
<text x="28" y="496" font-size="14">This continuation performs no device writes, replay activation or route transfer.</text>
</g></svg>
